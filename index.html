<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TAMILJANAM NLE PRODUCTION MIS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f0f2f7;--surf:#fff;--surf2:#f5f7fb;--brd:#e2e8f0;--brd2:#cbd5e1;
  --txt:#0f172a;--mt:#64748b;--dim:#94a3b8;
  --blue:#2563eb;--bl:#eff6ff;--blm:#bfdbfe;
  --green:#059669;--gl:#ecfdf5;
  --amber:#d97706;--al:#fffbeb;
  --red:#dc2626;--rl:#fef2f2;
  --purple:#7c3aed;--cyan:#0891b2;--cl:#ecfeff;
  --grad:linear-gradient(135deg,#1d4ed8,#0891b2);
  --sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 16px rgba(0,0,0,.1);--shl:0 10px 40px rgba(0,0,0,.12);
  --r:12px;--rs:8px;
}
[data-theme="dark"]{
  --bg:#080c14;--surf:#0d1117;--surf2:#111520;--brd:#1a1f35;--brd2:#222840;
  --txt:#e8eaf0;--mt:#5a6080;--dim:#2a3050;
  --bl:rgba(37,99,235,.12);--blm:rgba(37,99,235,.3);--gl:rgba(5,150,105,.12);
  --al:rgba(217,119,6,.12);--rl:rgba(220,38,38,.12);--cl:rgba(8,145,178,.12);
  --sh:0 1px 3px rgba(0,0,0,.4);--shm:0 4px 16px rgba(0,0,0,.4);--shl:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh;transition:background .3s,color .3s}
input,select,button,textarea{font-family:'Inter',sans-serif;outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}

/* SCREENS */
.scr{display:none}.scr.active{display:block}

/* TOPBAR */
.topbar{height:56px;background:var(--surf);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:300;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.brand-name{font-size:13px;font-weight:700}
.brand-sub{font-size:10px;color:var(--mt);font-family:'JetBrains Mono'}
.tb-right{display:flex;align-items:center;gap:8px}

/* LAYOUT */
.app-wrap{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:224px;background:var(--surf);border-right:1px solid var(--brd);padding:14px 8px;flex-shrink:0;overflow-y:auto}
.content{flex:1;overflow-x:hidden}
.page{padding:20px}

/* NAV */
.nsec{font-size:9px;font-weight:700;letter-spacing:.15em;color:var(--dim);padding:10px 12px 4px;text-transform:uppercase;font-family:'JetBrains Mono'}
.ni{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mt);cursor:pointer;transition:all .15s;border:none;background:transparent;width:100%;text-align:left;margin-bottom:2px}
.ni:hover{color:var(--txt);background:var(--surf2)}
.ni.active{color:var(--blue);background:var(--bl);font-weight:600}
.ni-ico{font-size:15px;width:20px;text-align:center}

/* BUTTONS */
.btn{border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'Inter';transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn-p{background:var(--grad);color:#fff;padding:9px 18px;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--surf2);color:var(--txt);border:1px solid var(--brd2);padding:8px 16px}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-d{background:var(--rl);color:var(--red);border:1px solid rgba(220,38,38,.2);padding:8px 16px}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn-ico{width:32px;height:32px;border-radius:7px;background:var(--surf2);border:1px solid var(--brd);color:var(--mt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.btn-ico:hover{border-color:var(--blue);color:var(--blue)}

/* INPUTS */
.inp{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--brd2);border-radius:8px;color:var(--txt);font-size:13px;transition:border .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blm)}
.inp-sm{padding:6px 10px;font-size:12px}
.lbl{font-size:11px;font-weight:600;color:var(--mt);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.fg{margin-bottom:14px}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.card-sm{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rs);padding:14px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--mt);letter-spacing:.08em;text-transform:uppercase;background:var(--surf2);border-bottom:2px solid var(--brd)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--brd);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--bl)}
.tbl tfoot td{border-top:2px solid var(--brd);border-bottom:none;font-weight:700;background:var(--surf2)}

/* STAT */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.sv{font-size:26px;font-weight:800;font-family:'JetBrains Mono';margin:4px 0 2px}
.sl{font-size:11px;color:var(--mt);font-weight:500}

/* BADGE */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;font-family:'JetBrains Mono'}

/* PROGRESS */
.prog{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .5s}

/* COUNTER */
.ctr{display:flex;align-items:center;gap:6px}
.ctr-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--brd2);background:var(--surf2);color:var(--txt);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ctr-btn:hover{border-color:var(--blue);color:var(--blue)}
.ctr-val{width:34px;text-align:center;font-family:'JetBrains Mono';font-weight:600;font-size:15px}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.sec-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sec-sub{font-size:12px;color:var(--mt);margin-top:3px}

/* NEWS ITEM */
.ni-item{background:var(--surf2);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;transition:border .2s}
.ni-item:hover{border-color:var(--blue)}

/* BREAK ROW */
.brk-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--al);border:1px solid rgba(217,119,6,.2);border-radius:8px;margin-bottom:8px;flex-wrap:wrap}

/* SCORE RING */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;text-align:center}

/* SHIFT TABLE */
.sh-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--brd)}
.sh-tbl{width:100%;border-collapse:collapse;font-size:12px}
.sh-tbl th{background:var(--surf2);padding:8px 5px;text-align:center;font-size:10px;font-weight:700;color:var(--mt);border:1px solid var(--brd)}
.sh-tbl th.tl{text-align:left;padding-left:10px}
.sh-tbl td{padding:2px 3px;border:1px solid var(--brd);vertical-align:middle}
.sh-stk{position:sticky;left:0;z-index:2;background:var(--surf)}
.sh-stk2{position:sticky;left:30px;z-index:2;background:var(--surf)}
.sh-sel{font-size:11px;padding:3px 2px;border-radius:4px;border:none;cursor:pointer;font-weight:600;text-align:center;width:100%;background:transparent;font-family:'Inter'}
.s1{background:#fbbf2418;color:#d97706}.s2{background:#60a5fa18;color:#2563eb}
.sn{background:#7c6fff18;color:#6355e8}.sg2{background:#2dd4bf18;color:#0d9488}
.smn{background:#34d39918;color:#16a34a}.sof{background:#f8717130;color:#dc2626;font-weight:700}
.scp{background:#818cf818;color:#6366f1}.scl{background:#fb923c18;color:#ea580c}
.ssl{background:#f472b618;color:#db2777}.spl{background:#fbbf2418;color:#d97706}
.slp{background:#f8717140;color:#dc2626;font-style:italic}.shl{background:#2dd4bf18;color:#0d9488}
.sem{background:var(--surf2);color:var(--dim)}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:16px}
.mo.open{display:flex}
.mo-box{background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl)}
.mo-t{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.mo-x{cursor:pointer;color:var(--mt);font-size:22px;line-height:1;background:none;border:none}
.mo-ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* TOAST */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-60px);padding:10px 22px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:var(--shm)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loader.gone{display:none}
.ld-ring{width:46px;height:46px;border:3px solid var(--brd);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
.ld-txt{font-size:12px;color:var(--mt);font-family:'JetBrains Mono'}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aup{animation:fadeUp .3s ease forwards}

/* LOGIN PAGE */
.login-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:var(--shl)}

/* DB STATUS */
.db-st{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mt)}
.db-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.db-dot.ld{background:var(--amber);animation:pulse 1s infinite}
.db-dot.er{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MOBILE */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);padding:6px 12px 10px;z-index:300}
.mob-wrap{display:flex;justify-content:space-around}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:var(--mt);cursor:pointer;padding:5px 8px;border-radius:8px;border:none;background:transparent;min-width:48px}
.mob-btn.active{color:var(--blue);background:var(--bl)}
.mob-btn .mi{font-size:18px}

@media(max-width:900px){.sidebar{display:none}.mob-nav{display:block}.page{padding:14px;padding-bottom:80px}}
@media(max-width:600px){.sg{grid-template-columns:1fr 1fr}}
@media(min-width:901px){.mob-nav{display:none}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="loader"><div class="ld-ring"></div><div class="ld-txt" id="ld-msg">Connecting...</div></div>

      <div style="font-size:18px;font-weight:800;letter-spacing:-.3px">TAMILJANAM</div>

     ADMIN SCREEN

<script>
// ══════════════════════════════════════════════
// SUPABASE CONFIG — replace with your values
// ══════════════════════════════════════════════
const SB_URL = "%%SUPABASE_URL%%";
const SB_KEY = "%%SUPABASE_ANON_KEY%%";






const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

// ══════════════════════════════════════════════
// MASTER DATA
// ══════════════════════════════════════════════
const NEWS_TYPES = [

// SCORE CALC
// ══════════════════════════════════════════════
function calcScore(empId, dept, month){
  const days = Object.keys(DAILY[empId]||{}).filter(d=>d.startsWith(month));
  const pdays = Object.keys(PROD_DAILY[empId]||{}).filter(d=>d.startsWith(month));
  let wpts=0,items=0;
  if(dept==="NLE Editor"){
    days.forEach(d=>(DAILY[empId][d]||[]).forEach(it=>{const nt=NEWS_TYPES.find(n=>n.key===it.type)||{weight:1};wpts+=nt.weight;items++;}));
  } else if(dept==="News Producer"){
    pdays.forEach(d=>{const pd=PROD_DAILY[empId][d]||{};PROD_FIELDS.forEach(f=>{const v=parseInt(pd[f.key])||0;wpts+=v;items+=v;});});
  } else if(dept==="Voice Over"){
    pdays.forEach(d=>{const pd=PROD_DAILY[empId][d]||{};VO_FIELDS.forEach(f=>{const v=parseInt(pd[f.key])||0;wpts+=v;items+=v;});});
  }
  const outputScore=Math.min(100,Math.round(wpts/1.5));
  let qualDeduct=0;
  Object.keys(QUALITY[empId]||{}).filter(d=>d.startsWith(month)).forEach(d=>{
    const q=QUALITY[empId][d]||{};
    QUALITY_ITEMS.filter(qi=>qi.depts.includes(dept)).forEach(qi=>qualDeduct+=Math.abs(qi.pts)*(parseInt(q[qi.key])||0));
  });
  const qualityScore=Math.max(0,100-qualDeduct);
  const rData=RELIABILITY[empId]?.[month]||{};
  const relRaw=REL_ITEMS.reduce((s,r)=>s+(parseInt(rData[r.key])||7),0);
  const reliScore=Math.round(relRaw/REL_ITEMS.length/10*100);
  const creativityScore=(parseInt(rData.creativity)||5)*10;
  const final=Math.round(qualityScore*0.4+outputScore*0.3+reliScore*0.2+creativityScore*0.1);
  return{final,qualityScore,outputScore,reliScore,creativityScore,wpts,items};
}

async function loadAll(role="admin", empId=null){
  // ── employees ──
  setLd("Loading employees...");
  let empQuery = sb.from("employees").select("*").order("name");
  // Employee RLS only returns their own row — that's fine
  // Admin RLS returns all rows
  const{data:ed,error:eErr}=await empQuery;
  if(eErr) console.error("employees error:",eErr.message,"code:",eErr.code);
  else console.log("employees loaded:",ed?.length,"rows");
  EMPS=(ed||[]).map(e=>({id:e.emp_code,name:e.name,dept:e.dept,is_active:e.is_active,_uuid:e.id}));

  // ── shifts ──
  setLd("Loading shifts...");
  const{data:sd,error:sErr}=await sb.from("shift_entries").select("*");
  if(sErr) console.error("shift_entries error:",sErr.message);
  SHIFTS={};
  (sd||[]).forEach(s=>{
    if(!SHIFTS[s.shift_date])SHIFTS[s.shift_date]={};
    SHIFTS[s.shift_date][s.employee_id]={shift:s.shift_code,remarks:s.remarks||""};
  });

  // ── attendance ──
  setLd("Loading attendance...");
  const{data:ad,error:aErr}=await sb.from("attendance").select("*");
  if(aErr) console.error("attendance error:",aErr.message);
  ATTENDANCE={};
  (ad||[]).forEach(a=>{
    if(!ATTENDANCE[a.emp_id])ATTENDANCE[a.emp_id]={};
    ATTENDANCE[a.emp_id][a.date]={
      in_time:   a.in_time?.slice(0,5)||null,
      out_time:  a.out_time?.slice(0,5)||null,
      in_location:  a.in_location||null,
      out_location: a.out_location||null,
    };
  });

  // Build UUID → emp_code lookup map (available after EMPS is loaded)
  const uuidToCode = {};
  EMPS.forEach(e => { uuidToCode[e._uuid] = e.id; });
  console.log("UUID map built, entries:", Object.keys(uuidToCode).length);

  // ── NLE daily entries ──
  setLd("Loading daily entries...");
  const{data:nd,error:nErr}=await sb.from("nle_daily_entries").select("*").order("created_at");
  if(nErr) console.error("nle_daily_entries error:",nErr.message);
  DAILY={};
  (nd||[]).forEach(r=>{
    const code = uuidToCode[r.emp_id] || r.emp_id; // fallback
    if(!DAILY[code])DAILY[code]={};
    if(!DAILY[code][r.date])DAILY[code][r.date]=[];
    DAILY[code][r.date].push({
      _id:r.id, type:r.news_type, desc:r.description||"",
      startTime:r.start_time?.slice(0,5)||"",
      endTime:r.end_time?.slice(0,5)||"",
      manualMins:r.manual_mins||0
    });
  });

  // ── producer daily ──
  setLd("Loading producer entries...");
  const{data:pd,error:pErr}=await sb.from("producer_daily").select("*");
  if(pErr) console.error("producer_daily error:",pErr.message);
  PROD_DAILY={};
  (pd||[]).forEach(r=>{
    const code = uuidToCode[r.emp_id] || r.emp_id;
    if(!PROD_DAILY[code])PROD_DAILY[code]={};
    PROD_DAILY[code][r.date]=r;
  });

  // ── breaks ──
  setLd("Loading breaks...");
  const{data:bd,error:bErr}=await sb.from("breaks").select("*");
  if(bErr) console.error("breaks error:",bErr.message);
  BREAKS={};
  (bd||[]).forEach(b=>{
    const code = uuidToCode[b.emp_id] || b.emp_id;
    if(!BREAKS[code])BREAKS[code]={};
    if(!BREAKS[code][b.date])BREAKS[code][b.date]=[];
    BREAKS[code][b.date].push({_id:b.id,type:b.break_type,start:b.start_time?.slice(0,5)||"",end:b.end_time?.slice(0,5)||""});
  });

  // ── attendance ──
  // (already loaded above — re-map to use emp_code)
  const attMapped={};
  Object.entries(ATTENDANCE).forEach(([uuid,dates])=>{
    const code = uuidToCode[uuid] || uuid;
    attMapped[code]=dates;
  });
  ATTENDANCE=attMapped;

  // ── quality errors ──
  setLd("Loading quality & reliability...");
  const{data:qd,error:qErr}=await sb.from("quality_errors").select("*");
  if(qErr) console.error("quality_errors error:",qErr.message);
  QUALITY={};

    const code = uuidToCode[q.emp_id] || q.emp_id;
    if(!QUALITY[code])QUALITY[code]={};
    if(!QUALITY[code][q.date])QUALITY[code][q.date]={};
    QUALITY[code][q.date][q.error_key]=q.count;
  });

  // ── reliability scores ──
  const{data:rd,error:rErr}=await sb.from("reliability_scores").select("*");
  if(rErr) console.error("reliability_scores error:",rErr.message);
  RELIABILITY={};
  (rd||[]).forEach(r=>{
    const code = uuidToCode[r.emp_id] || r.emp_id;
    if(!RELIABILITY[code])RELIABILITY[code]={};
    RELIABILITY[code][r.month]={on_time:r.on_time,emergency:r.emergency,team_coord:r.team_coord,night_shift:r.night_shift,pressure:r.pressure,creativity:r.creativity};
  });

  console.log("=== DATA LOADED ===");
  console.log("EMPS:",EMPS.length,"SHIFTS dates:",Object.keys(SHIFTS).length);
  console.log("EMPS sample:",EMPS.slice(0,2));
}

// Get the UUID (employees.id) from emp_code — needed for FK columns
function getEmpUUID(empCode){
  const e = EMPS.find(x => x.id === empCode);
  if(!e){ console.error("UUID not found for emp_code:", empCode); return null; }
  return e._uuid;
}

// Get current location as text string
async function getLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){resolve(null);return;}
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const lat=pos.coords.latitude.toFixed(6);
        const lng=pos.coords.longitude.toFixed(6);
        resolve(`${lat},${lng}`);
      },
      ()=>resolve(null),
      {timeout:8000,enableHighAccuracy:true}
    );
  });
}

  ATTENDANCE[empCode][today].in_time=now;

  const fields={in_time:now};
  if(loc)fields.in_location=loc;
  await sbSaveAttendance(empCode,today,fields);
  toast("✓ IN: "+now+(loc?" 📍 Location saved":""));
  // Re-render the same page
  if(container&&dept)renderDailyEntry(empCode,dept,today,container,ME.role==="admin");
  else if(ME.role==="admin")aRender();
  else eRender();
}

// Record OUT
async function recordOUT(empCode, container, dept){
  const today=todayStr();
  const now=new Date().toTimeString().slice(0,5);
  toast("📍 Getting location...");
  const loc=await getLocation();
  if(!ATTENDANCE[empCode])ATTENDANCE[empCode]={};
  if(!ATTENDANCE[empCode][today])ATTENDANCE[empCode][today]={};
  ATTENDANCE[empCode][today].out_time=now;
  if(loc)ATTENDANCE[empCode][today].out_location=loc;
  const fields={out_time:now};
  if(loc)fields.out_location=loc;
  await sbSaveAttendance(empCode,today,fields);
  toast("✓ OUT: "+now+(loc?" 📍 Location saved":""));
  if(container&&dept)renderDailyEntry(empCode,dept,today,container,ME.role==="admin");
  else if(ME.role==="admin")aRender();
  else eRender();
}

async function sbSaveQuality(empCode, date, key, count){
  // quality_errors.emp_id is UUID (references employees.id) not emp_code
  const uuid = getEmpUUID(empCode);
  if(!uuid){ toast("Employee UUID not found for: "+empCode,"er"); return; }

  if(count<=0){
    const{error}=await sb.from("quality_errors").delete()
      .eq("emp_id",uuid).eq("date",date).eq("error_key",key);
    if(error){console.error("Quality delete error:",error.message);toast("Delete failed: "+error.message,"er");}
    else toast("✓ Cleared");
  } else {
    const rec={emp_id:uuid, date, error_key:key, count};
    console.log("Quality upsert:",JSON.stringify(rec));
    const{data,error}=await sb.from("quality_errors")
      .upsert(rec, {onConflict:"emp_id,date,error_key"})
      .select();
    if(error){
      console.error("Quality error:",error.message,"code:",error.code);
      toast("Quality save failed: "+error.message,"er");
    } else {
      console.log("Quality saved:",data);
      toast("✓ Error count saved");
    }
  }
}

async function sbSaveReliability(empCode, month, data){
  // reliability_scores.emp_id is UUID (references employees.id) not emp_code
  const uuid = getEmpUUID(empCode);
  if(!uuid){ toast("Employee UUID not found for: "+empCode,"er"); return; }

  const rec={
    emp_id:     uuid,
    month,
    on_time:    data.on_time    ?? 7,
    emergency:  data.emergency  ?? 7,
    team_coord: data.team_coord ?? 7,
    night_shift:data.night_shift?? 7,
    pressure:   data.pressure   ?? 7,
    creativity: data.creativity ?? 5,
  };
  console.log("Reliability upsert:",JSON.stringify(rec));
  const{data:saved,error}=await sb.from("reliability_scores")
    .upsert(rec, {onConflict:"emp_id,month"})
    .select();
  if(error){
    console.error("Reliability error:",error.message,"code:",error.code);
    toast("Reliability save failed: "+error.message,"er");
  } else {
    console.log("Reliability saved:",saved);
    toast("✓ Reliability saved");
  }
}

async function doLogin(){
  const email=$("li-email").value.trim();
  const pass=$("li-pass").value;
  const errEl=$("li-err");
  errEl.style.display="none";
  if(!email||!pass){errEl.textContent="Enter email and password";errEl.style.display="block";return;}

  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){errEl.textContent=error.message;errEl.style.display="block";return;}

  // DEBUG: log session metadata to console so you can verify role
  console.log("=== SESSION DEBUG ===");
  console.log("email:", data.session?.user?.email);
  console.log("app_metadata:", JSON.stringify(data.session?.user?.app_metadata));
  console.log("user_metadata:", JSON.stringify(data.session?.user?.user_metadata));
  console.log("role from meta:", data.session?.user?.app_metadata?.role);

  await afterLogin(data.session);
}

async function afterLogin(session){
  if(!session)return;

  // Read role — check both app_metadata and user_metadata as fallback
  const appMeta = session.user.app_metadata || {};
  const userMeta = session.user.user_metadata || {};
  const role = appMeta.role || userMeta.role || "employee";
  const empId = appMeta.emp_id || userMeta.emp_id || null;

  ME = { role, emp_id:empId, email:session.user.email };

  // Load all data
  setLd("Loading data...");
  $("loader").classList.remove("gone");
  await loadAll(role, empId);
  $("loader").classList.add("gone");

  if(role === "admin"){
    const emp = empId ? EMPS.find(e => e.id === empId) : null;
    ME.name = emp?.name || session.user.email;
    ME.dept = emp?.dept || "NLE Editor";
    ME.id   = emp?.id  || null;
    ME.hasEmpRecord = !!emp;
    openAdmin();

  } else {
    // For employee: EMPS will only contain their own row (RLS)
    // So find by emp_code OR just use what we know from metadata
    const emp = EMPS.find(e => e.id === empId);
    if(!emp){
      // RLS might have blocked — try fetching directly with emp_code filter
      setLd("Loading your profile...");
      const{data:empData, error:empErr} = await sb
        .from("employees")
        .select("*")
        .eq("emp_code", empId)
        .single();
      if(empErr || !empData){
        $("loader").classList.add("gone");
        console.error("Employee fetch error:", empErr?.message, "empId:", empId);
        const errEl = $("li-err");
        errEl.textContent = "Employee record not found (code: "+empId+"). Contact your admin.";
        errEl.style.display = "block";
        await sb.auth.signOut();
        show("s-login");
        return;
      }
      // Add to EMPS so getEmpUUID works
      const mapped = {id:empData.emp_code, name:empData.name, dept:empData.dept, is_active:empData.is_active, _uuid:empData.id};
      EMPS.push(mapped);
      ME.name = empData.name;
      ME.dept = empData.dept;
      ME.id   = empId;
      ME.hasEmpRecord = true;
      $("loader").classList.add("gone");
    } else {
      ME.name = emp.name;
      ME.dept = emp.dept;
      ME.id   = empId;
      ME.hasEmpRecord = true;
    }
    openEmp();
  }
}

async function doLogout(){
  await sb.auth.signOut();
  ME=null;EMPS=[];DAILY={};BREAKS={};QUALITY={};RELIABILITY={};PROD_DAILY={};ATTENDANCE={};SHIFTS={};
  show("s-login");
}

// NLE ACTIONS
function nleAddItem(empId, date, container, dept){
  if(!DAILY[empId])DAILY[empId]={};
  if(!DAILY[empId][date])DAILY[empId][date]=[];
  DAILY[empId][date].push({type:"vo_sot",desc:"",startTime:"",endTime:"",manualMins:0});
  renderDailyEntry(empId,dept,date,container,false);
}

function nleUpdateField(empId, date, idx, field, val){
  const it=DAILY[empId]?.[date]?.[idx];
  if(it!==undefined)it[field]=val;
}

function nleSetNow(empId, date, idx, field, container, dept){
  const now=new Date().toTimeString().slice(0,5);
  nleUpdateField(empId,date,idx,field,now);
  renderDailyEntry(empId,dept,date,container,false);
}

async function nleSaveItem(empId, date, idx){
  const it=DAILY[empId]?.[date]?.[idx];
  if(!it)return;
  const ok=await sbSaveNLEItem(empId,date,it);
  if(ok)toast("✓ Saved");
}

async function nleDeleteItem(empId, date, idx, container, dept){
  const it=DAILY[empId]?.[date]?.[idx];
  if(!it)return;
  const ok=await sbDeleteNLEItem(it);
  if(ok){

function renderBreaksTab(empId, dateStr, container){
  const breaks=BREAKS[empId]?.[dateStr]||[];
  const totalBreak=breaks.reduce((s,b)=>s+(tdiff(b.start,b.end)||0),0);
  let html=`<div class="sec-hdr">
    <div><div class="sec-title">Break / Lunch</div><div class="sec-sub">${fmtDate(dateStr)}</div></div>
  </div>
  <div class="card">
    <button class="btn btn-p" style="width:100%;padding:10px;margin-bottom:14px" onclick="brkAdd('${empId}','${dateStr}','${container}')">＋ Add Break</button>`;
  breaks.forEach((b,i)=>{
    const bt=BREAK_TYPES.find(x=>x.key===b.type)||BREAK_TYPES[0];
    const mins=tdiff(b.start,b.end);
    html+=`<div class="brk-row">
      <span style="font-size:18px">${bt.icon}</span>
      <select class="inp inp-sm" style="flex:1;max-width:140px" onchange="brkUpdate('${empId}','${dateStr}',${i},'type',this.value)">
        ${BREAK_TYPES.map(x=>`<option value="${x.key}" ${x.key===b.type?"selected":""}>${x.icon} ${x.label}</option>`).join("")}
      </select>
      <input type="time" class="inp inp-sm" value="${b.start||''}" style="width:110px" onchange="brkUpdate('${empId}','${dateStr}',${i},'start',this.value)"/>
      <span style="color:var(--mt);font-weight:600">→</span>
      <input type="time" class="inp inp-sm" value="${b.end||''}" style="width:110px" onchange="brkUpdate('${empId}','${dateStr}',${i},'end',this.value)"/>
      ${mins!==null?`<span style="font-size:12px;font-weight:700;color:${bt.color};font-family:'JetBrains Mono'">${fmtMin(mins)}</span>`:""}
      <button class="btn btn-p btn-sm" onclick="brkSave('${empId}','${dateStr}',${i})">💾</button>
      <button class="btn btn-d btn-sm" onclick="brkDelete('${empId}','${dateStr}',${i},'${container}')">🗑</button>
    </div>`;
  });
  if(totalBreak>0)html+=`<div style="margin-top:10px;text-align:center;font-size:13px;font-weight:600;color:var(--amber)">Total Break Time: ${fmtMin(totalBreak)}</div>`;
  html+=`</div>`;
  $(container).innerHTML=html;
}

function brkAdd(empId, date, container){
  if(!BREAKS[empId])BREAKS[empId]={};
  if(!BREAKS[empId][date])BREAKS[empId][date]=[];
  BREAKS[empId][date].push({type:"lunch",start:"",end:""});
  renderBreaksTab(empId,date,container);
}

function brkUpdate(empId, date, idx, field, val){
  const b=BREAKS[empId]?.[date]?.[idx];if(b)b[field]=val;
}

async function brkSave(empId, date, idx){
  const b=BREAKS[empId]?.[date]?.[idx];if(!b)return;
  const ok=await sbSaveBreakItem(empId,date,b);
  if(ok)toast("✓ Break saved");
}

async function brkDelete(empId, date, idx, container){
  const b=BREAKS[empId]?.[date]?.[idx];if(!b)return;
  const ok=await sbDeleteBreak(b);
  if(ok){BREAKS[empId][date].splice(idx,1);toast("✓ Deleted");renderBreaksTab(empId,date,container);}
}

function openAdmin(){
  show("s-admin");

  // Hide "My Work" tab if admin has no linked employee record (e.g. maintenance/developer)
  const myWorkNav=$("an-mywork");

  if(!ME.hasEmpRecord){
    if(myWorkNav)myWorkNav.style.display="none";

function aNav(tab){
  aTab=tab;
  const tabs=["mywork","overview","today","att","shifts","staff","quality","rel","prod","report"];
  tabs.forEach(t=>{
    const el=$("at-"+t);if(el)el.style.display=t===tab?"block":"none";
    const n=$("an-"+t);if(n)n.classList.toggle("active",t===tab);
    const m=$("am-"+t);if(m)m.classList.toggle("active",t===tab);
  });
  aRender();
}

function aRender(){
  const d=$("a-date").value||todayStr();
  if(aTab==="mywork")renderDailyEntry(ME.id,ME.dept,d,"at-mywork",true);
  else if(aTab==="overview")renderOverview(d);
  else if(aTab==="today")renderToday(d);
  else if(aTab==="att")renderAttendance(d);
  else if(aTab==="shifts")renderShifts();
  else if(aTab==="staff")renderStaff();
  else if(aTab==="quality")renderQuality(d);
  else if(aTab==="rel")renderReliability();
  else if(aTab==="prod")renderProducers(d);
  else if(aTab==="report")renderReport();
}

const SH_MAP=
{  
  '2ND SHIFT'            : '2ND',
  '1ST SHIFT'            : '1ST',
  'NIGHT'                : 'NIGHT',
  'OFF'                  : 'OFF',
  'OFFREQUESTED'        : 'OFFREQUESTED',
  '-1STSHIFTREQUESTED' : '1STSHIFTREQUESTED',
  '-2NDSHIFTREQUESTED' : '2NDSHIFTREQUESTED',
  '1STSHIFTREQUESTED' : '1STSHIFTREQUESTED',
  '2NDSHIFTREQUESTED' : '2NDSHIFTREQUESTED',
  'NOON SHIFT'           : 'MN',
  'GEN'                  : 'GEN',
  'COMP_HOL'             : 'COMP_HOL',
  'COMP_WEEK'            : 'COMP_WEEK',
  'CL'                   : 'CL',
  'SL'                   : 'SL',
  'PL'                   : 'PL',
  'LOP'                  : 'LOP',
  'HOL'                  : 'HOL'
};
function normShift(raw){const s=raw.trim().toUpperCase().replace(/\s+/g," ");return SH_MAP[s]||null;}

async function importCSV(input){
  const file=input.files[0];if(!file)return;input.value="";
  const text=await file.text();const rows=[];
  const lines=text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return toast("Empty file","er");
  const delim=lines[0].includes("\t")?"\t":",";
  let hIdx=lines.findIndex(l=>/\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2}/.test(l));
  if(hIdx===-1)hIdx=0;
  const hCols=lines[hIdx].split(delim);
  const dates=[];
  for(let c=2;c<hCols.length;c++){
    const raw=hCols[c].trim();
    if(/^\d{2}-\d{2}-\d{4}$/.test(raw)){const[dd,mm,yyyy]=raw.split("-");dates.push(`${yyyy}-${mm}-${dd}`);}
    else if(/^\d{4}-\d{2}-\d{2}$/.test(raw))dates.push(raw);
    else dates.push(null);
  }
  const skipped=[];
  for(let i=hIdx+1;i<lines.length;i++){
    const cols=lines[i].split(delim);if(cols.length<3)continue;
    const col0=cols[0].trim(),nameRaw=cols[1].trim();
    let empId=null;
    const byId=EMPS.find(e=>e.id===col0);
    if(byId){empId=col0;}
    else{const byName=EMPS.find(e=>e.name.toUpperCase()===nameRaw.toUpperCase());if(byName)empId=byName.id;else{skipped.push(nameRaw);continue;}}
    for(let c=2;c<cols.length;c++){
      const sd=dates[c-2];if(!sd)continue;
      const sc=normShift(cols[c]||"");if(!sc)continue;
      rows.push({employee_id:empId,shift_date:sd,shift_code:sc,remarks:""});
    }
  }
  if(skipped.length)toast(`⚠ ${skipped.length} unmatched rows`,"er");
  if(!rows.length)return toast("No valid rows found","er");
  toast(`Uploading ${rows.length}...`);
  const BATCH=50;let failed=0;
  for(let i=0;i<rows.length;i+=BATCH){
    const batch=rows.slice(i,i+BATCH);
    const{error}=await sb.from("shift_entries").upsert(batch,{onConflict:"employee_id,shift_date"});
    if(error)failed+=batch.length;
    else batch.forEach(r=>{if(!SHIFTS[r.shift_date])SHIFTS[r.shift_date]={};SHIFTS[r.shift_date][r.employee_id]={shift:r.shift_code,remarks:""};});
  }
  renderShifts();
  if(failed)toast(`Done — ${failed} failed`,"er");
  else toast(`✓ ${rows.length} entries imported!`);
}

async function adjQ(empId, dateStr, key, delta, dept){

  QUALITY[empId][dateStr][key]=nv;
  const el=$("qv-"+empId+"-"+key);
  if(el){el.textContent=nv;el.style.color=nv>0?"var(--red)":"var(--txt)";}

  await sbSaveQuality(empId,dateStr,key,nv);

    </div>`;

  DCFG.forEach(cfg=>{
    const emps=EMPS.filter(e=>e.is_active&&e.dept===cfg.dept);
    const rows=emps.map(e=>{const d=cfg.getData(e);const sc=calcScore(e.id,e.dept,monthKey);return{emp:e,...d,sc};}).sort((a,b)=>b.wpts-a.wpts);
    const tTotals=Object.fromEntries(cfg.fields.map(f=>[f.key,rows.reduce((s,r)=>s+(r.fc[f.key]||0),0)]));
    const tItems=rows.reduce((s,r)=>s+r.items,0);
    const tWpts=rows.reduce((s,r)=>s+r.wpts,0);
    const tMins=rows.reduce((s,r)=>s+(r.mins||0),0);

    html+=`<div style="margin:20px;border-radius:10px;overflow:hidden;border:2px solid ${cfg.hex}30">
      <div style="background:${cfg.hex};padding:10px 16px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">${cfg.icon}</span>
        <span style="color:#fff;font-weight:700;font-size:13px">${cfg.dept.toUpperCase()}</span>
        <span style="color:rgba(255,255,255,.7);font-size:11px;margin-left:auto">${emps.length} staff</span>
      </div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:${cfg.hex}10">
          <th style="padding:8px 10px;text-align:left;color:var(--mt);font-size:10px">#</th>
          <th style="padding:8px 10px;text-align:left;color:var(--mt);font-size:10px">Name</th>
          <th style="padding:8px 10px;text-align:left;color:var(--mt);font-size:10px">ID</th>
          ${cfg.fields.map(f=>`<th style="padding:8px 10px;text-align:center;color:${f.color||cfg.hex};font-size:10px">${f.icon||""} ${f.label}</th>`).join("")}
          <th style="padding:8px 10px;text-align:center;color:var(--mt);font-size:10px">Total</th>
          <th style="padding:8px 10px;text-align:center;color:var(--mt);font-size:10px">Pts</th>
          ${cfg.showTime?`<th style="padding:8px 10px;text-align:center;color:var(--mt);font-size:10px">Time</th>`:""}
          <th style="padding:8px 10px;text-align:center;color:var(--mt);font-size:10px">Score</th>
        </tr></thead><tbody>`;

    rows.forEach((r,i)=>{
      const b=perfBadge(r.sc.final);
      html+=`<tr style="border-bottom:1px solid #f1f5f9;${i%2===0?"background:#fafafa":""}">
        <td style="padding:8px 10px;color:#94a3b8">${i+1}</td>
        <td style="padding:8px 10px;font-weight:600">${r.emp.name}</td>
        <td style="padding:8px 10px;font-family:'JetBrains Mono';font-size:10px;color:#94a3b8">${r.emp.id}</td>
        ${cfg.fields.map(f=>`<td style="padding:8px 10px;text-align:center;font-family:'JetBrains Mono';color:${(r.fc[f.key]||0)>0?f.color||cfg.hex:"#cbd5e1"}">${r.fc[f.key]||"—"}</td>`).join("")}
        <td style="padding:8px 10px;text-align:center;font-weight:700;font-family:'JetBrains Mono';color:${cfg.hex}">${r.items}</td>
        <td style="padding:8px 10px;text-align:center;font-weight:800;font-family:'JetBrains Mono';color:${cfg.hex}">${r.wpts}</td>
        ${cfg.showTime?`<td style="padding:8px 10px;text-align:center;font-family:'JetBrains Mono';color:#059669">${fmtMin(r.mins)}</td>`:""}
        <td style="padding:8px 10px;text-align:center"><span style="background:${b.bg};color:${b.color};padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600">${r.sc.final}</span></td>
      </tr>`;
    });

    html+=`</tbody><tfoot><tr style="background:${cfg.hex}">
      <td colspan="3" style="padding:10px 12px;font-weight:800;color:#fff;font-size:11px">TEAM TOTAL</td>
      ${cfg.fields.map(f=>`<td style="padding:10px;text-align:center;font-family:'JetBrains Mono';font-weight:700;color:#fff">${tTotals[f.key]||"—"}</td>`).join("")}
      <td style="padding:10px;text-align:center;font-family:'JetBrains Mono';font-weight:800;color:#fff">${tItems}</td>
      <td style="padding:10px;text-align:center;font-family:'JetBrains Mono';font-weight:800;color:#fff">${tWpts}</td>
      ${cfg.showTime?`<td style="padding:10px;text-align:center;font-family:'JetBrains Mono';color:rgba(255,255,255,.8)">${fmtMin(tMins)}</td>`:""}
      <td style="padding:10px;text-align:center;color:rgba(255,255,255,.7)">—</td>
    </tr></tfoot></table></div></div>`;
  });

  html+=`<div style="padding:10px 20px;background:#f8fafc;font-size:10px;color:#94a3b8;display:flex;justify-content:space-between;border-top:1px solid #e2e8f0">
    <span>TAMILJANAM NLE PRODUCTION MIS · Confidential</span>
    <span>Generated: ${new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</span>
  </div></div>`;

  $("at-report").innerHTML=html;
}

function exportExcel(){
  if(typeof XLSX==="undefined")return toast("XLSX lib not loaded","er");
  const now=new Date();
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const monthLabel=now.toLocaleString("en-IN",{month:"long",year:"numeric"});
  const wb=XLSX.utils.book_new();
  const headers=["#","Dept","ID","Name",...NEWS_TYPES.map(n=>n.label),"Total Items","Weighted Pts","Mins","Score"];
  const data=[headers];
  EMPS.filter(e=>e.is_active&&e.dept==="NLE Editor").forEach((e,i)=>{
    const days=Object.keys(DAILY[e.id]||{}).filter(d=>d.startsWith(monthKey));
    let wpts=0,items=0,mins=0;const tc=Object.fromEntries(NEWS_TYPES.map(n=>[n.key,0]));
    days.forEach(d=>(DAILY[e.id][d]||[]).forEach(it=>{const nt=NEWS_TYPES.find(n=>n.key===it.type)||{weight:1};tc[it.type]=(tc[it.type]||0)+1;wpts+=nt.weight;items++;mins+=tdiff(it.startTime,it.endTime)??it.manualMins??0;}));
    const sc=calcScore(e.id,e.dept,monthKey);
    data.push([i+1,e.dept,e.id,e.name,...NEWS_TYPES.map(n=>tc[n.key]||0),items,wpts,mins,sc.final]);
  });
  const ws=XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb,"MIS",ws);
  XLSX.writeFile(wb,`TJ_MIS_${monthLabel.replace(" ","_")}.xlsx`);
  toast("✓ Excel downloaded");
}

async function exportImg(){
  const el=$("rpt-wrap");if(!el)return;
  toast("Generating...");
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);const a=document.createElement("a");
      a.href=url;a.download=`TJ_MIS_${todayStr()}.png`;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);toast("✓ Image downloaded");
    },"image/png");
  }catch(e){toast("Failed: "+e.message,"er");}
}

async function init(){
  loadTheme();
  setLd("Checking session...");

  // Check existing session
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    await afterLogin(session);
  } else {
    $("loader").classList.add("gone");
    show("s-login");
  }

  // Auth state listener
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==="SIGNED_OUT"){show("s-login");}
  });
}

init();
